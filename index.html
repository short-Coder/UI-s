<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>UI's Editor</title>
<style>
body {
    margin: 0;
    font-family: sans-serif;
    background: #fff;
}

/* 上部バー */
.header {
    background: #659aff;
    height: 40px;
    display: flex;
    align-items: center;
    padding-left: 20px;
    gap: 20px;
}
.header button {
    background: #fff;
    border: none;
    padding: 5px 10px;
    font-size: 14px;
}

/* キャンバス */
.canvas {
    width: 100%;
    height: 300px;
    position: relative;
    background: #f0f0f0;
}

/* 選択枠 */
.selector {
    position: absolute;
    border: 2px solid #0021ff;
    display: none;
}
.selector .handle {
    width: 10px;
    height: 10px;
    background: #0021ff;
    position: absolute;
}
.handle.tl { left: -5px; top: -5px; }
.handle.tr { right: -5px; top: -5px; }
.handle.bl { left: -5px; bottom: -5px; }
.handle.br { right: -5px; bottom: -5px; }

/* 下部メニュー */
.bottom-menu {
    border-top: 2px solid #000;
    height: 120px;
    display: none;
    padding: 10px;
    display: grid;
    grid-template-columns: 120px 1fr 150px;
    gap: 20px;
}

/* 色メニュー */
.color-box {
    border: 2px solid #000;
    padding: 5px;
}
.color-box h3 {
    margin: 0;
    font-size: 14px;
}
.slider-group {
    margin-top: 10px;
}
.slider-group label {
    display: block;
    font-size: 12px;
}

/* レイヤー */
.layer-box {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.layer-box button {
    padding: 5px;
    border: 2px solid #000;
    background: #fff;
}

/* 変形 */
.transform-box {
    border: 2px solid #000;
    padding: 10px;
}
.transform-box button {
    width: 100%;
    padding: 5px;
    border: 2px solid #000;
    background: #fff;
}
</style>
</head>
<body>

<div class="header">
    <button>UI's</button>
    <button>新規作成</button>
    <button>ファイル</button>
    <button>フィードバック</button>
</div>

<div class="canvas" id="canvas">
    <img id="img1" src="https://via.placeholder.com/150" 
         style="position:absolute; left:150px; top:80px; cursor:pointer;">
    
    <div class="selector" id="selector">
        <div class="handle tl"></div>
        <div class="handle tr"></div>
        <div class="handle bl"></div>
        <div class="handle br"></div>
    </div>
</div>

<div class="bottom-menu" id="menu">
    <div class="color-box">
        <h3>色</h3>
        <div class="slider-group">
            <label>R <input type="range" min="0" max="255"></label>
            <label>G <input type="range" min="0" max="255"></label>
            <label>B <input type="range" min="0" max="255"></label>
            <label>A <input type="range" min="0" max="1" step="0.01"></label>
        </div>
    </div>

    <div class="layer-box">
        <button>前面</button>
        <button>背面</button>
        <button>最前面</button>
        <button>最背面</button>
    </div>

    <div class="transform-box">
        <button>変形させる</button>
    </div>
</div>

<script>
const img = document.getElementById("img1");
const selector = document.getElementById("selector");
const menu = document.getElementById("menu");

img.addEventListener("click", () => {
    selector.style.display = "block";
    menu.style.display = "grid";

    selector.style.left = img.style.left;
    selector.style.top = img.style.top;
    selector.style.width = img.width + "px";
    selector.style.height = img.height + "px";
});
</script>

</body>
</html>
